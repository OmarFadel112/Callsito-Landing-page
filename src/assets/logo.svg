<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
<defs>
  <style>
    .wm  { font-family: Georgia, 'Times New Roman', serif; font-size: 38px; font-weight: 400; letter-spacing: 8px; fill: #E8F0FE; }
    .sub { font-family: Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: 400; letter-spacing: 5px; fill: #6B90C9; }
  </style>

  <!-- Sphere base gradient: soft light source upper-left -->
  <radialGradient id="sphereGrad" cx="38%" cy="34%" r="75%">
    <stop offset="0%" stop-color="#2B4A80"/>
    <stop offset="45%" stop-color="#152C52"/>
    <stop offset="100%" stop-color="#0B1629"/>
  </radialGradient>

  <!-- Crescent highlight gradient -->
  <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8FC1FF"/>
    <stop offset="55%" stop-color="#4A90D9"/>
    <stop offset="100%" stop-color="#1E3A6E"/>
  </linearGradient>

  <!-- Soft outer glow for the sphere -->
  <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
    <stop offset="60%" stop-color="#2563EB" stop-opacity="0"/>
    <stop offset="100%" stop-color="#2563EB" stop-opacity="0.25"/>
  </radialGradient>

  <!-- Crescent mask: sphere minus an offset circle leaves a clean, even crescent -->
  <mask id="crescentMask">
    <rect width="680" height="400" fill="black"/>
    <circle cx="340" cy="165" r="58" fill="white"/>
    <circle cx="360" cy="150" r="53" fill="black"/>
  </mask>

  <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>

<!-- Background -->
<rect width="680" height="400" fill="#080F1E"/>

<!-- Outer glow behind rings -->
<circle cx="340" cy="165" r="92" fill="url(#glowGrad)"/>

<!-- Outer ring -->
<circle cx="340" cy="165" r="88" fill="none" stroke="#1A3060" stroke-width="1"/>
<!-- Dotted orbit ring -->
<circle cx="340" cy="165" r="72" fill="none" stroke="#1D4ED8" stroke-width="0.7" stroke-dasharray="2.5 3.5" opacity="0.5"/>

<!-- Sphere body with soft directional shading -->
<circle cx="340" cy="165" r="58" fill="url(#sphereGrad)"/>

<!-- Clean, symmetric crescent highlight -->
<circle cx="340" cy="165" r="58" fill="url(#crescentGrad)" mask="url(#crescentMask)" opacity="0.9"/>

<!-- Rim light: thin bright arc tracing the lit edge -->
<circle cx="340" cy="165" r="57.3" fill="none" stroke="#9FCBFF" stroke-width="1.1" opacity="0.55" mask="url(#crescentMask)"/>

<!-- Soft terminator glow where light meets shadow -->
<circle cx="360" cy="150" r="53" fill="none" stroke="#5B93D6" stroke-width="2" opacity="0.25" filter="url(#softBlur)"/>

<!-- Agent network connection lines (symmetric diamond around hub) -->
<line x1="340" y1="165" x2="308" y2="145" stroke="#2563EB" stroke-width="0.8" opacity="0.6"/>
<line x1="340" y1="165" x2="372" y2="145" stroke="#2563EB" stroke-width="0.8" opacity="0.6"/>
<line x1="340" y1="165" x2="310" y2="185" stroke="#2563EB" stroke-width="0.8" opacity="0.6"/>
<line x1="340" y1="165" x2="370" y2="185" stroke="#2563EB" stroke-width="0.8" opacity="0.6"/>
<line x1="308" y1="145" x2="372" y2="145" stroke="#1D4ED8" stroke-width="0.5" opacity="0.3"/>
<line x1="310" y1="185" x2="370" y2="185" stroke="#1D4ED8" stroke-width="0.5" opacity="0.3"/>

<!-- Central hub node — recentered on the sphere for true symmetry -->
<circle cx="340" cy="165" r="5.5" fill="#0B1629" stroke="#3B82F6" stroke-width="1.2"/>
<circle cx="340" cy="165" r="2.5" fill="#60A5FA"/>

<!-- Agent nodes — mirrored pairs -->
<circle cx="308" cy="145" r="3.5" fill="#0B1629" stroke="#2563EB" stroke-width="1"/>
<circle cx="308" cy="145" r="1.5" fill="#93C5FD"/>

<circle cx="372" cy="145" r="3.5" fill="#0B1629" stroke="#2563EB" stroke-width="1"/>
<circle cx="372" cy="145" r="1.5" fill="#93C5FD"/>

<circle cx="310" cy="185" r="3" fill="#0B1629" stroke="#1D4ED8" stroke-width="0.9"/>
<circle cx="310" cy="185" r="1.4" fill="#7CB9F4"/>

<circle cx="370" cy="185" r="3" fill="#0B1629" stroke="#1D4ED8" stroke-width="0.9"/>
<circle cx="370" cy="185" r="1.4" fill="#7CB9F4"/>

<!-- Accent stars — symmetric placement -->
<circle cx="268" cy="138" r="1.2" fill="#4A7FC1" opacity="0.7"/>
<circle cx="412" cy="138" r="1.2" fill="#4A7FC1" opacity="0.7"/>
<circle cx="272" cy="195" r="1" fill="#4A7FC1" opacity="0.5"/>
<circle cx="408" cy="195" r="1" fill="#4A7FC1" opacity="0.5"/>
<circle cx="340" cy="76" r="1" fill="#4A7FC1" opacity="0.4"/>

<!-- Wordmark -->
<text x="340" y="290" class="wm" text-anchor="middle">CALLISTO</text>
<text x="340" y="312" class="sub" text-anchor="middle">ZERO-TRUST AI SECURITY</text>
</svg>
